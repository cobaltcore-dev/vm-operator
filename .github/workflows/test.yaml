name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
permissions:
  contents: read

jobs:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run tests
        run: make test
