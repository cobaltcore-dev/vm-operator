kube-prometheus-stack:
  # kube-prometheus-stack deploys a bunch of components we don't need for local
  # development. Disable all of them and keep only the operator (which also
  # installs the monitoring.coreos.com CRDs). The Prometheus and Alertmanager
  # instances are provided by this chart's own templates instead.
  # See: https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/ci/01-provision-crds-values.yaml
  coreDns:
    enabled: false
  kubeApiServer:
    enabled: false
  kubeControllerManager:
    enabled: false
  kubeDns:
    enabled: false
  kubeEtcd:
    enabled: false
  kubeProxy:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeStateMetrics:
    enabled: false
  kubelet:
    enabled: false
  nodeExporter:
    enabled: false
  grafana:
    enabled: false
  defaultRules:
    create: false
  alertmanager:
    enabled: false
  prometheus:
    enabled: false
  fullnameOverride: "vm-operator"
  prometheusOperator:
    enabled: true
    fullnameOverride: prometheus-operator
    serviceMonitor:
      selfMonitor: false
    tls:
      enabled: false
    admissionWebhooks:
      enabled: false
    namespaces:
      releaseNamespace: true
      additional:
        - kube-system
