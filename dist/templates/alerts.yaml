# NOTE: This file is rendered by Helm. If you add Prometheus templating
# directives (e.g. $labels.foo inside double braces) to any alert, escape the
# outer braces so Helm does not try to evaluate them, e.g. write the opening
# and closing pair as {{ "{{" }} ... {{ "}}" }}.

{{- if .Values.alerts.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: vm-operator-alerts
  namespace: {{ .Release.Namespace }}
  labels:
    type: alerting-rules
    app.kubernetes.io/name: vm-operator
    app.kubernetes.io/component: alerts
    {{- with .Values.alerts.prometheus }}
    prometheus: {{ . | quote }}
    {{- end }}
spec:
  groups:
    - name: vm-operator-alerts
      rules:
        - alert: VMOperatorDown
          expr: |
            up{job=~"vm-operator.*"} != 1 or
            absent(up{job=~"vm-operator.*"})
          for: 5m
          labels:
            context: liveness
            service: vm-operator
            severity: warning
            support_group: compute
          annotations:
            summary: "VM Operator is down"
            description: >
              The vm-operator manager is not reporting metrics (or its metrics
              endpoint is unreachable). Reconciliation of VirtualMachine
              resources is likely stalled. Investigate the manager Deployment
              and its leader election.
        - alert: NovaPollStalled
          expr: |
            rate(vm_operator_nova_poll_duration_seconds_count{result="success",job=~"vm-operator.*"}[2h]) == 0
          for: 1h
          labels:
            context: sync
            service: vm-operator
            severity: warning
            support_group: compute
          annotations:
            summary: "Nova poll loop has stalled"
            description: >
              The vm-operator has not completed a successful Nova poll in the
              last 2 hours, so its view of the Nova fleet is going stale and
              VirtualMachine resources may no longer reflect reality. A single
              poll lists every server in the region and can legitimately take up
              to an hour in the largest regions, so this only fires once well
              beyond a normal cycle. Check the manager logs and Nova/Keystone
              reachability.
        - alert: NovaPollErrors
          expr: |
            rate(vm_operator_nova_poll_errors_total{job=~"vm-operator.*"}[1h]) > 0
          for: 1h
          labels:
            context: sync
            service: vm-operator
            severity: warning
            support_group: compute
          annotations:
            summary: "Nova poll loop is failing"
            description: >
              The vm-operator Nova poll loop has been failing continuously for
              an hour (listing servers from Nova or VirtualMachines from the
              apiserver). The reconcile set cannot be computed, so changes in
              Nova are not being picked up.
        - alert: NovaAPIErrors
          expr: |
            sum(rate(vm_operator_nova_api_requests_total{outcome="error",job=~"vm-operator.*"}[1h]))
              /
            sum(rate(vm_operator_nova_api_requests_total{job=~"vm-operator.*"}[1h]))
              > 0.1
          for: 30m
          labels:
            context: openstack
            service: vm-operator
            severity: warning
            support_group: compute
          annotations:
            summary: "Elevated Nova API error rate"
            description: >
              More than 10% of the vm-operator's Nova API requests have failed
              over the last hour. This usually points at Nova/Keystone
              availability or credential/endpoint misconfiguration.
        - alert: NovaReconcileErrors
          expr: |
            sum(rate(vm_operator_nova_reconcile_total{outcome="error",job=~"vm-operator.*"}[1h]))
              /
            sum(rate(vm_operator_nova_reconcile_total{job=~"vm-operator.*"}[1h]))
              > 0.1
          for: 30m
          labels:
            context: sync
            service: vm-operator
            severity: warning
            support_group: compute
          annotations:
            summary: "Elevated VirtualMachine reconcile error rate"
            description: >
              More than 10% of VirtualMachine reconciles have ended in error
              over the last hour. Affected resources are being retried but
              are not converging to Nova's state; check the manager logs.
        - alert: NovaReconcileBacklog
          expr: |
            vm_operator_nova_reconcile_backlog{job=~"vm-operator.*"} > 0
          for: 2h
          labels:
            context: sync
            service: vm-operator
            severity: warning
            support_group: compute
          annotations:
            summary: "Nova reconcile backlog is not draining"
            description: >
              The vm-operator has had VirtualMachines queued for reconciliation
              for 2 hours without the backlog clearing. In the largest regions a
              single poll-and-reconcile cycle can take up to an hour, so this
              only fires once the backlog has survived several cycles. Reconciles
              may be failing or running slower than polls produce work.
{{- end }}
