{{- if .Values.rbac.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vm-operator-manager
  labels:
    app.kubernetes.io/name: vm-operator
    app.kubernetes.io/component: rbac
rules:
  # Reconcile on the VirtualMachine CRD.
  - apiGroups:
      - cobaltcore.cloud
    resources:
      - virtualmachines
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - cobaltcore.cloud
    resources:
      - virtualmachines/status
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - cobaltcore.cloud
    resources:
      - virtualmachines/finalizers
    verbs:
      - update
  # Leader election.
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # Event recording.
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vm-operator-manager
  labels:
    app.kubernetes.io/name: vm-operator
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vm-operator-manager
subjects:
  - kind: ServiceAccount
    name: vm-operator-manager
    namespace: {{ .Release.Namespace }}
{{- end }}
