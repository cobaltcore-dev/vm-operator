{{- if .Values.multicluster.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: vm-operator-multicluster
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: vm-operator
    app.kubernetes.io/component: manager
type: Opaque
data:
  # The full multicluster client configuration, including any remote apiserver
  # CA certificates. Loaded by the manager from /etc/vm-operator/multicluster.json.
  multicluster.json: {{ .Values.multicluster.config | toJson | b64enc | quote }}
{{- end }}
{{- if and .Values.openstack.enabled .Values.openstack.createSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: vm-operator-openstack
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: vm-operator
    app.kubernetes.io/component: manager
type: Opaque
data:
  # The OpenStack client configuration (credentials + endpoint). Loaded by the
  # manager from /etc/vm-operator/openstack/openstack.json.
  openstack.json: {{ .Values.openstack.config | toJson | b64enc | quote }}
{{- end }}
