owner-info:
  enabled: true
  helm-chart-url: "https://github.com/cobaltcore-dev/vm-operator/blob/main/helm"
  maintainers: ["The CobaltCore Team"]
  service: "vm-operator"

# [CRDs]: To enable the CRDs
crd:
  # This option determines whether the CRDs are included
  # in the installation process.
  enable: true
  # Enabling this option adds the "helm.sh/resource-policy": keep
  # annotation to the CRD, ensuring it remains installed even when
  # the Helm release is uninstalled.
  # NOTE: Removing the CRDs will also remove all cert-manager CR(s)
  # (Certificates, Issuers, ...) due to garbage collection.
  keep: true

# [Manager]: The controller-manager Deployment and its ServiceAccount.
manager:
  # Whether to render the manager Deployment and ServiceAccount.
  enabled: true
  # Number of replicas. Kept at 3 to pair with leader election so a
  # single active manager is elected while the others stand by.
  replicas: 3
  image:
    repository: ghcr.io/cobaltcore-dev/vm-operator
    # Empty by default: the image tag falls back to the chart's appVersion, so
    # the deployed image matches the released chart. Override for local dev.
    tag: ""
    pullPolicy: IfNotPresent
  # Metrics endpoint. Served over plain HTTP.
  metrics:
    bindAddress: ":2112"
    # Named port used by the metrics Service and ServiceMonitor.
    port: 2112
  # Health/readiness probe endpoint.
  healthProbeBindAddress: ":8081"
  # Named port used by health probes. Kept separate from healthProbeBindAddress
  # so probes don't break if a host prefix is added to the bind address.
  healthProbePort: 8081
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 128Mi

# [RBAC]: ClusterRole and ClusterRoleBinding the manager needs to
# reconcile VirtualMachine objects and run leader election.
rbac:
  enabled: true

# [Monitoring]: metrics Service and a Prometheus Operator ServiceMonitor.
# Requires the monitoring.coreos.com/v1 CRDs to be present in the cluster.
monitoring:
  enabled: true
  serviceMonitor:
    # Scrape interval for the ServiceMonitor.
    interval: 30s

# [Alerts]: a Prometheus Operator PrometheusRule with basic liveness alerts.
# Requires the monitoring.coreos.com/v1 CRDs to be present in the cluster.
alerts:
  enabled: true
  # Optional value for the "prometheus" label on the PrometheusRule, used by
  # some Prometheus instances to select which rules to load. Leave empty to omit.
  prometheus: ""

# [Multicluster]: configuration for the cortex multicluster client. The whole
# `config` block below (including any remote apiserver caCert) is rendered into
# a Kubernetes Secret and mounted into the manager pod at
# /etc/vm-operator/multicluster.json, where the manager loads it at startup.
multicluster:
  enabled: true
  config:
    apiservers:
      # Resources managed in the cluster where the vm-operator runs.
      home:
        gvks:
          - cobaltcore.cloud/v1alpha1/VirtualMachine
          - cobaltcore.cloud/v1alpha1/VirtualMachineList
      # Resources managed in remote clusters. Each remote apiserver must accept
      # the manager ServiceAccount's tokens (see structured auth). VirtualMachine
      # writes are routed to the remote whose labels.availabilityZone matches the
      # VM's spec.az.
      # remotes:
      #   - host: https://remote-apiserver:6443
      #     caCert: |
      #       -----BEGIN CERTIFICATE-----
      #       ...
      #       -----END CERTIFICATE-----
      #     insecureSkipTLSVerify: false
      #     gvks:
      #       - cobaltcore.cloud/v1alpha1/VirtualMachine
      #       - cobaltcore.cloud/v1alpha1/VirtualMachineList
      #     labels:
      #       availabilityZone: qa-de-1a
      remotes: []

# [Nova]: tuning for the Nova sync controller. The controller only runs when
# `openstack.enabled` is true (see below); these knobs are non-secret and are
# passed to the manager as CLI flags rather than through the credentials Secret.
nova:
  # How often the sync controller polls Nova for changed servers. A non-positive
  # value falls back to the manager's built-in default (300s), and values below
  # one second are clamped. Rendered as the --nova-sync-interval flag.
  syncInterval: 300s
  # How long a VirtualMachine carrying no Nova status may exist (measured from
  # creation) before the garbage collector prunes it as an orphan. A fresh or
  # slow-to-sync resource is granted this full window before it becomes
  # eligible. Rendered as the --nova-orphan-ttl flag.
  orphanTTL: 1h
  # Grace window between the garbage collector marking a VM for deletion (Nova
  # reported the server DELETED) and actually deleting it. If Nova reports the
  # server live again within this window, the deletion is cancelled. Rendered as
  # the --nova-deletion-ttl flag.
  deletionTTL: 1h

# [OpenStack]: credentials and endpoint for the Nova sync controller. The whole
# `config` block below is rendered into a Kubernetes Secret and mounted into the
# manager pod at /etc/vm-operator/openstack/openstack.json, where the manager
# loads it at startup. Field names match nova.OpenStackClientConfig's JSON tags.
#
# Leave enabled=false (the default) to deploy the manager without a Nova client;
# the sync controller will not function until this is configured. For local dev
# the Tiltfile fills these from your shell's OS_* environment variables.
openstack:
  enabled: false
  # Whether the chart renders the credentials Secret from the `config` block
  # below. Set to false when the Secret is created out-of-band (e.g. by Tilt in
  # local dev, so the password never passes through a `helm --set` argument);
  # the manager still gets the volume/mount/flag as long as `enabled` is true.
  createSecret: true
  config:
    # Keystone identity endpoint (OS_AUTH_URL), e.g. https://keystone.example.com/v3
    url: ""
    # Service-catalog endpoint to use: public, internal, or admin.
    availability: public
    # Technical user credentials (OS_USERNAME / OS_PASSWORD).
    username: ""
    password: ""
    # Project and domain scope (OS_PROJECT_NAME / OS_USER_DOMAIN_NAME /
    # OS_PROJECT_DOMAIN_NAME).
    projectName: ""
    userDomainName: ""
    projectDomainName: ""
    # Optional: region (OS_REGION_NAME) and Nova microversion.
    region: ""
    microversion: ""
